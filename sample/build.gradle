apply plugin: 'com.android.application'

android {
    compileSdkVersion androidCompileSdkVersion

    compileOptions {
        sourceCompatibility 1.8
        targetCompatibility 1.8
        coreLibraryDesugaringEnabled true
    }

    defaultConfig {
        applicationId "org.smartregister.chw.cecap_sample"
        minSdkVersion androidMinSdkVersion
        targetSdkVersion androidTargetSdkVersion
        versionCode 1
        versionName "1.0"
        multiDexEnabled true
        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
        javaCompileOptions {
            annotationProcessorOptions {
                includeCompileClasspath = true
            }
        }

    }

    dexOptions {
        preDexLibraries = false
        javaMaxHeapSize "4g"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
            buildConfigField "int", "DATABASE_VERSION", '1'
        }

        debug {
            buildConfigField "int", "DATABASE_VERSION", '1'
        }
    }

    packagingOptions {
        exclude 'META-INF/DEPENDENCIES.txt'
        exclude 'META-INF/LICENSE.txt'
        exclude 'META-INF/LICENSE.md'
        exclude 'META-INF/NOTICE.txt'
        exclude 'META-INF/NOTICE'
        exclude 'META-INF/LICENSE'
        exclude 'META-INF/DEPENDENCIES'
        exclude 'META-INF/notice.txt'
        exclude 'META-INF/license.txt'
        exclude 'META-INF/dependencies.txt'
        exclude 'META-INF/LGPL2.1'
        exclude 'LICENSE.txt'
    }

    lintOptions {
        checkReleaseBuilds false
        disable 'MissingTranslation'
        checkReleaseBuilds false
        abortOnError false
    }

}

buildscript {
    repositories {
        google()
        mavenCentral()
        jcenter()
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:4.2.2'
        classpath 'org.kt3k.gradle.plugin:coveralls-gradle-plugin:2.8.2'
    }
}

def githubProperties = new Properties()
if (file("github.properties").exists()) {
    githubProperties.load(new FileInputStream(file("github.properties")))
}

def simprintsRepoUrl = System.getenv("SIMPRINTS_MAVEN_URL")
def simprintsRepoUser = System.getenv("SIMPRINTS_MAVEN_USER") ?: ""
def simprintsRepoPassword = System.getenv("SIMPRINTS_MAVEN_PASSWORD") ?: ""
def includeSimprintsRepo = simprintsRepoUrl != null && !simprintsRepoUrl.trim().isEmpty()

allprojects {
    repositories {
        google()
        mavenCentral()
        maven { url 'https://oss.sonatype.org/content/repositories/snapshots/' }
        maven { url 'https://jitpack.io' }
        maven {
            name = "GitHubPackages"
            url = uri("https://maven.pkg.github.com/Digital-Square-Tanzania/CircleProgressbar.git")
            credentials {
                username = githubProperties['gpr.usr'] ?: System.getenv("GITHUB_ACTOR") ?: System.getenv("GPR_USER")
                password = githubProperties['gpr.key'] ?: System.getenv("GITHUB_TOKEN") ?: System.getenv("GPR_API_KEY")
            }
        }
        if (includeSimprintsRepo) {
            maven {
                url simprintsRepoUrl
                credentials {
                    username = simprintsRepoUser
                    password = simprintsRepoPassword
                }
            }
        }
        mavenLocal()
    }
}

dependencies {
    implementation('org.smartregister:opensrp-client-core:1.18.0-MOH-SNAPSHOT@aar') {
        transitive = true
        exclude group: 'com.github.bmelnychuk', module: 'atv'
        exclude group: 'com.google.guava', module: 'guava'
        exclude group: 'com.android.support', module: 'appcompat-v7'
        exclude group: 'com.android.support', module: 'design'
        exclude group: 'com.android.support', module: 'recyclerview-v7'
        exclude group: 'com.github.johnkil.print', module: 'print'
        exclude group: 'org.apache.httpcomponents', module: 'httpmime'
        exclude group: 'net.zetetic', module: 'android-database-sqlcipher'
        exclude group: 'com.ibm.fhir'
        exclude group: 'org.apache.commons', module: 'commons-lang3'
        if (!includeSimprintsRepo) {
            exclude group: 'com.simprints', module: 'libsimprints'
        }
    }

    implementation group: 'id.zelory', name: 'compressor', version: '3.0.1'
    implementation(platform("org.jetbrains.kotlin:kotlin-bom:1.8.0"))
    implementation 'net.zetetic:sqlcipher-android:4.5.4'

    implementation('org.smartregister:opensrp-client-native-form:3.1.8-NACP-SNAPSHOT') {
        transitive = true
        exclude group: 'com.android.support', module: 'recyclerview-v7'
        exclude group: 'com.android.support', module: 'appcompat-v7'
        exclude group: 'com.android.support', module: 'cardview-v7'
        exclude group: 'io.ona.CircleProgressbar', module: 'lib'
        exclude group: 'id.zelory', module: 'compressor'
        exclude group: 'com.google.guava', module: 'guava'
    }
    implementation 'com.emredavarci:circleprogressbar:1.0.8-SNAPSHOT'

    implementation('org.smartregister:opensrp-client-configurable-views:1.1.5-SNAPSHOT@aar') {
        transitive = true
        exclude group: 'org.smartregister', module: 'opensrp-client-core'
        exclude group: 'org.smartregister', module: 'opensrp-client-native-form'
        exclude group: 'com.android.support', module: 'appcompat-v7'
        exclude group: 'com.google.guava', module: 'guava'
    }
    implementation(project(':opensrp-chw-cecap')) {
        exclude group: 'net.zetetic', module: 'android-database-sqlcipher'
        exclude group: 'com.ibm.fhir'
        exclude group: 'org.apache.commons', module: 'commons-lang3'
    }

    implementation 'org.jbundle.util.osgi.wrapped:org.jbundle.util.osgi.wrapped.org.apache.http.client:4.1.2'

    implementation 'androidx.media:media:1.0.0'
    implementation 'androidx.legacy:legacy-support-v4:1.0.0'
    implementation 'androidx.appcompat:appcompat:1.0.0'

    implementation 'de.hdodenhof:circleimageview:3.1.0'

    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:1.1.5'

    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.2.1'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.6.1'
}

configurations.all {
    resolutionStrategy.force 'net.zetetic:sqlcipher-android:4.5.4'
    resolutionStrategy.force 'androidx.work:work-runtime:2.7.1'
    resolutionStrategy.force 'androidx.annotation:annotation-experimental:1.0.0'
}
